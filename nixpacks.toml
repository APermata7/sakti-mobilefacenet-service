[phases.setup]
nixPkgs = ["python310", "gcc", "g++"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.post_install]
cmds = ["python -c \"import insightface; insightface.app.FaceAnalysis(name='buffalo_l')\""]

[phases.start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port 5002"